<!DOCTYPE html>
<html>
<head>
    <title>Bandcamp Now Playing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        html, body {
            min-width: 400px;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        main.container {
            width: 100%;
        }
        #networkToggle {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        #networkToggle button {
            flex: 1;
        }
        #networkToggle button.active {
            font-weight: bold;
        }
        .authSection {
            margin-bottom: 8px;
        }
        #charCount {
            font-size: 0.85em;
            text-align: right;
            margin: 4px 0 8px;
        }
        #charCount.over {
            color: #c00;
            font-weight: bold;
        }
        #postnow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <main class="container">
        <div id="networkToggle">
            <button id="btnMastodon" class="active">Mastodon</button>
            <button id="btnBluesky">Bluesky</button>
        </div>

        <div id="mastodonSection">
            <div id="mastodonAuth" class="authSection">
                <h3>Mastodon Settings</h3>
                <input id="mastodonInstance" placeholder="Instance URL (e.g. https://mastodon.social)" />
                <input id="mastodonToken" placeholder="Access Token" type="password" />
                <button id="saveMastodon">Save</button>
                <div id="mastodonStatus"></div>
            </div>
            <div id="mastodonLoggedIn" style="display: none;">
                <p id="mastodonLoggedInMessage"></p>
                <button id="logoutMastodon">Logout</button>
            </div>
        </div>

        <div id="blueskySection" style="display: none;">
            <div id="blueskyAuth" class="authSection">
                <h3>Bluesky Settings</h3>
                <input id="blueskyHandle" placeholder="Bluesky Handle (e.g. user.bsky.social)" />
                <input id="blueskyAppPassword" placeholder="App Password" type="password" />
                <button id="saveBluesky">Save</button>
                <div id="blueskyStatus"></div>
            </div>
            <div id="blueskyLoggedIn" style="display: none;">
                <p id="blueskyLoggedInMessage"></p>
                <button id="logoutBluesky">Logout</button>
            </div>
        </div>

        <hr>
        <div id="nowplaying">Loading now playing info…</div>
        <textarea id="comment" placeholder="Add a comment..." rows="3"></textarea>
        <div id="charCount"></div>
        <input id="tags" placeholder="Tags (e.g. #genre #bandname)" />
        <button id="postnow">Post Now</button>
        <div id="poststatus"></div>
    </main>
    <script src="compose.js"></script>
    <script src="popup.js"></script>
</body>
</html>
